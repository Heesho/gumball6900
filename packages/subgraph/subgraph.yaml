specVersion: 1.3.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: GBX
    network: robinhood
    source:
      abi: GBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: GBX
          file: ./abis/GBX.json
      eventHandlers:
        - event: Minted(indexed address,uint256)
          handler: handleMinted
        - event: Burned(indexed address,uint256)
          handler: handleBurned
        - event: MinterSet(indexed address,indexed address)
          handler: handleMinterSet
      file: ./src/gbx.ts
  - kind: ethereum/contract
    name: Fundraiser
    network: robinhood
    source:
      abi: Fundraiser
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - FundraiserEpoch
        - ProtocolEvent
      abis:
        - name: Fundraiser
          file: ./abis/Fundraiser.json
      eventHandlers:
        - event: Contributed(indexed address,indexed address,indexed uint256,uint256)
          handler: handleContributed
        - event: Claimed(indexed address,indexed uint256,uint256)
          handler: handleClaimed
        - event: EpochSettled(indexed uint256,uint256,uint256,uint256)
          handler: handleEpochSettled
      file: ./src/fundraiser.ts
  - kind: ethereum/contract
    name: LiquidityPosition
    network: robinhood
    source:
      abi: LiquidityPosition
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: LiquidityPosition
          file: ./abis/LiquidityPosition.json
      eventHandlers:
        - event: Compounded(indexed uint256,indexed
            address,uint128,uint128,uint128,uint256,uint256,uint256,uint256)
          handler: handleCompounded
        - event: PositionRecorded(indexed uint256,indexed address,indexed bytes32)
          handler: handlePositionRecorded
      file: ./src/liquidity-position.ts
  - kind: ethereum/contract
    name: SignalGBX
    network: robinhood
    source:
      abi: SignalGBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: SignalGBX
          file: ./abis/SignalGBX.json
      eventHandlers:
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,uint256)
          handler: handleUnstaked
        - event: ResonanceSet(indexed address)
          handler: handleSignalResonanceSet
      file: ./src/signal-gbx.ts
  - kind: ethereum/contract
    name: ResonanceRouter
    network: robinhood
    source:
      abi: ResonanceRouter
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: ResonanceRouter
          file: ./abis/ResonanceRouter.json
      eventHandlers:
        - event: RevenueRouted(indexed address,uint256)
          handler: handleRevenueRouted
      file: ./src/resonance-router.ts
  - kind: ethereum/contract
    name: Resonance
    network: robinhood
    source:
      abi: Resonance
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - Strategy
        - ProtocolEvent
      abis:
        - name: Resonance
          file: ./abis/Resonance.json
      eventHandlers:
        - event: BribeRewardAdded(indexed address,indexed address,indexed address)
          handler: handleBribeRewardAdded
        - event: RevenueDistributed(indexed address,indexed address,uint256)
          handler: handleRevenueDistributed
        - event: RevenueNotified(indexed address,uint256)
          handler: handleRevenueNotified
        - event: RevenueSynced(indexed address,uint256)
          handler: handleRevenueSynced
        - event: FundRevenueAccrued(uint256,uint256)
          handler: handleFundRevenueAccrued
        - event: FundRevenuePaid(indexed address,indexed address,uint256)
          handler: handleFundRevenuePaid
        - event: StrategyAdded(indexed address,indexed address,indexed address,address)
          handler: handleStrategyAdded
        - event: StrategyKilled(indexed address)
          handler: handleStrategyKilled
        - event: SignalAdded(indexed address,indexed address,uint256)
          handler: handleSignalAdded
        - event: SignalRemoved(indexed address,indexed address,uint256)
          handler: handleSignalRemoved
        - event: ResonanceRouterSet(indexed address)
          handler: handleResonanceRouterSet
      file: ./src/resonance.ts
  - kind: ethereum/contract
    name: Fund
    network: robinhood
    source:
      abi: Fund
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: Fund
          file: ./abis/Fund.json
      eventHandlers:
        - event: GBXBurned(indexed address,uint256)
          handler: handleFundGBXBurned
        - event: Redeemed(indexed address,indexed address,uint256,uint256)
          handler: handleRedeemed
      file: ./src/fund.ts
  - kind: ethereum/contract
    name: TimelockController
    network: robinhood
    source:
      abi: TimelockController
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: TimelockController
          file: ./abis/TimelockController.json
      eventHandlers:
        - event: CallScheduled(indexed bytes32,indexed
            uint256,address,uint256,bytes,bytes32,uint256)
          handler: handleCallScheduled
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: handleCallExecuted
        - event: CallSalt(indexed bytes32,bytes32)
          handler: handleCallSalt
        - event: Cancelled(indexed bytes32)
          handler: handleCancelled
        - event: MinDelayChange(uint256,uint256)
          handler: handleMinDelayChange
      file: ./src/timelock-controller.ts
templates:
  - kind: ethereum/contract
    name: BribeTemplate
    network: robinhood
    source:
      abi: Bribe
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - ProtocolEvent
      abis:
        - name: Bribe
          file: ./abis/Bribe.json
      eventHandlers:
        - event: RewardNotified(indexed address,uint256)
          handler: handleRewardNotified
        - event: RewardPaid(indexed address,indexed address,uint256)
          handler: handleRewardPaid
        - event: FundRewardAccrued(indexed address,uint256,uint256)
          handler: handleBribeFundRewardAccrued
        - event: FundRewardPaid(indexed address,indexed address,indexed address,uint256)
          handler: handleBribeFundRewardPaid
      file: ./src/bribe.ts
  - kind: ethereum/contract
    name: BribeRouterTemplate
    network: robinhood
    source:
      abi: BribeRouter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - ProtocolEvent
      abis:
        - name: BribeRouter
          file: ./abis/BribeRouter.json
      eventHandlers:
        - event: FundPaymentAccrued(indexed address,indexed address,uint256,uint256)
          handler: handleRouterFundPaymentAccrued
        - event: FundPaymentPaid(indexed address,indexed address,indexed address,uint256)
          handler: handleRouterFundPaymentPaid
      file: ./src/bribe-router.ts
