          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/deep-external-security"
          printf '%s\n' \
            "campaign=deep-external-security" \
            "releaseTag=$RELEASE_TAG" \
            "sourceCommit=$SOURCE_COMMIT" \
            "evidenceCommit=$EVIDENCE_COMMIT" \
            "workflowSha=$GITHUB_WORKFLOW_SHA" \
            "runId=$GITHUB_RUN_ID" \
            "runAttempt=$GITHUB_RUN_ATTEMPT" \
            >"$RUNNER_TEMP/deep-external-security/context.txt"
      - name: Resolve release-hermetic analyzer Python from source C
        id: deep_analyzer_environment
        run: |
          node packages/contracts/audit/resolve-analyzer-environment.mjs \
            --workspace "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          architecture: x64
          python-version: ${{ steps.deep_analyzer_environment.outputs.python_version }}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.24.6'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v${{ env.FOUNDRY_VERSION }}
      - name: Install exact external campaign toolchain
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          packages/contracts/audit/install-tools.sh nightly
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/release/assert-tracked-worktree.mjs \
            --workspace "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT"
      - name: Run source-C Echidna, Medusa, and selected Mythril campaigns
        run: |
          set -o pipefail
          packages/contracts/audit/run-nightly.sh 2>&1 \
            | tee "$RUNNER_TEMP/deep-external-security/nightly-runner.txt"
      - name: Package external security evidence even when compatibility blocks
        if: always()
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/deep-external-security"
          mkdir -p "$output/reports"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code
          node scripts/release/assert-tracked-worktree.mjs \
            --workspace "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT"
          if test -d packages/contracts/audit/reports; then
            cp -R packages/contracts/audit/reports/. "$output/reports/"
          fi
          cp packages/contracts/audit/analyzer-environment-policy.json "$output/analyzer-environment-policy.json"
          cp packages/contracts/audit/echidna.yaml "$output/echidna.yaml"
          cp packages/contracts/audit/medusa.json "$output/medusa.json"
          cp packages/contracts/audit/mythril-policy.json "$output/mythril-policy.json"
          cp packages/contracts/audit/toolchain.lock "$output/toolchain.lock"
          {
            node --version
            pnpm --version
            command -v python >/dev/null 2>&1 && python --version || true
            command -v forge >/dev/null 2>&1 && forge --version || true
            command -v medusa >/dev/null 2>&1 && medusa version || true
            command -v myth >/dev/null 2>&1 && myth version || true
          } >"$output/tool-versions.txt"
          cd "$output"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: deep-external-security-${{ inputs.releaseTag }}
          path: ${{ runner.temp }}/deep-external-security/
          retention-days: 365

  candidate_authorization:
    name: Protected candidate authorization; never publish or deploy
    needs:
      [
        resolve_tag,
        release_readiness,
        offline_gates,
        fork_gates,
        security_evidence,
        deep_contracts_economics,
        deep_external_security,
      ]
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_COMMIT: ${{ needs.resolve_tag.outputs.evidence_commit }}
      RELEASE_SOURCE_WORKSPACE: ${{ github.workspace }}/release-source
      RELEASE_TAG_OBJECT: ${{ needs.resolve_tag.outputs.tag_object }}
      SOURCE_COMMIT: ${{ needs.resolve_tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Prove trusted authorization-tool checkout
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.resolve_tag.outputs.evidence_commit }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v${{ env.FOUNDRY_VERSION }}
      - name: Revalidate exact evidence E after protected-environment approval
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
          test "$(git -C "$RELEASE_SOURCE_WORKSPACE" rev-parse HEAD)" = "$EVIDENCE_COMMIT"
          test "$(git -C "$RELEASE_SOURCE_WORKSPACE" cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git -C "$RELEASE_SOURCE_WORKSPACE" rev-parse "refs/tags/$RELEASE_TAG")" = "$RELEASE_TAG_OBJECT"
          test "$(git -C "$RELEASE_SOURCE_WORKSPACE" rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EVIDENCE_COMMIT"
          test "$(git -C "$RELEASE_SOURCE_WORKSPACE" rev-parse "$EVIDENCE_COMMIT^")" = "$SOURCE_COMMIT"
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$EVIDENCE_COMMIT"
          node "$GITHUB_WORKSPACE/scripts/release/robinhood-registry-revalidation.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" \
            --manifest "$RELEASE_MANIFEST_PATH" \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --evidence-commit "$EVIDENCE_COMMIT" \
            --source-commit "$SOURCE_COMMIT" \
            --stage protected-final \
            --output "$RUNNER_TEMP/protected-registry/robinhood-registry-revalidation.json" \
            --source-archive-output "$RUNNER_TEMP/protected-registry/robinhood-registry-response.json"
          node "$GITHUB_WORKSPACE/scripts/release/prepare-release.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" \
            --manifest "$RELEASE_MANIFEST_PATH" \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --evidence-commit "$EVIDENCE_COMMIT" \
            --source-commit "$SOURCE_COMMIT" \
            --registry-revalidation "$RUNNER_TEMP/protected-registry/robinhood-registry-revalidation.json" \
            --registry-revalidation-stage protected-final \
            --registry-response-archive "$RUNNER_TEMP/protected-registry/robinhood-registry-response.json" \
            --output-dir "$RUNNER_TEMP/release-authorization-inputs"
          pnpm --dir "$RELEASE_SOURCE_WORKSPACE" install --frozen-lockfile --ignore-scripts
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$EVIDENCE_COMMIT"
          pnpm --dir "$RELEASE_SOURCE_WORKSPACE" config:manifest:validate -- \
            --file "$RELEASE_SOURCE_WORKSPACE/$RELEASE_MANIFEST_PATH" --require-release-evidence
          git -c core.hooksPath=/dev/null -C "$RELEASE_SOURCE_WORKSPACE" checkout --quiet --detach "$SOURCE_COMMIT"
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$SOURCE_COMMIT"
      - name: Bind protected-final registry evidence to the signed mainnet fork context
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$SOURCE_COMMIT"
          node "$GITHUB_WORKSPACE/scripts/release/export-mainnet-fork-context.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" \
            --asset-candidate "$RUNNER_TEMP/release-authorization-inputs/reviewed-asset-candidate.json" \
            --manifest "$RUNNER_TEMP/release-authorization-inputs/deployment-manifest.json" \
            --config "$RUNNER_TEMP/release-authorization-inputs/deployment-config.json" \
            --manifest-repository-path "$RELEASE_MANIFEST_PATH" \
            --registry-revalidation "$RUNNER_TEMP/release-authorization-inputs/robinhood-registry-revalidation.json" \
            --registry-response-archive "$RUNNER_TEMP/release-authorization-inputs/robinhood-registry-response.json" \
            --registry-revalidation-stage protected-final \
            --evidence-commit "$EVIDENCE_COMMIT" \
            --source-commit "$SOURCE_COMMIT" \
            --tag "$RELEASE_TAG" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --github-env "$GITHUB_ENV" \
            --context "$RUNNER_TEMP/release-authorization-inputs/protected-final-mainnet-fork-context.json"
          context="$RUNNER_TEMP/release-authorization-inputs/protected-final-mainnet-fork-context.json"
          test "$(jq -r '.registryRevalidation.stage' "$context")" = protected-final
          test "$(jq -r '.registryRevalidation.authorizationEligible' "$context")" = true
          manifest_schema="$(jq -r '.schemaVersion' "$RUNNER_TEMP/release-authorization-inputs/deployment-manifest.json")"
          expected_variables=88
          if test "$manifest_schema" = 2; then expected_variables=92; fi
          test "$(jq -r '.variables | length' "$context")" = "$expected_variables"
      - name: Rehearse the complete protected-final mainnet fork context
        env:
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        working-directory: ${{ env.RELEASE_SOURCE_WORKSPACE }}/packages/contracts
        run: |
          set -euo pipefail
          set -o pipefail
          test "$SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test -n "$ROBINHOOD_MAINNET_RPC_URL"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$SOURCE_COMMIT"
          forge test \
            --match-path test/foundry/fork/RobinhoodMainnetFork.t.sol \
            -vv 2>&1 \
            | node "$GITHUB_WORKSPACE/scripts/release/redact-stream.mjs" ROBINHOOD_MAINNET_RPC_URL \
            | tee "$RUNNER_TEMP/release-authorization-inputs/protected-final-mainnet-fork.txt"
      - name: Requery signed block and current head immediately before authorization
        env:
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          set -o pipefail
          test "$SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test -n "$ROBINHOOD_MAINNET_RPC_URL"
          test -n "$ROBINHOOD_TESTNET_RPC_URL"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$SOURCE_COMMIT"
          manifest_repository_path="$RELEASE_MANIFEST_PATH"
          RELEASE_MANIFEST_PATH="$RUNNER_TEMP/release-authorization-inputs/deployment-manifest.json" \
            pnpm --dir "$RELEASE_SOURCE_WORKSPACE" contracts:release-observation:mainnet 2>&1 \
              | node "$GITHUB_WORKSPACE/scripts/release/redact-stream.mjs" ROBINHOOD_MAINNET_RPC_URL \
              | tee "$RUNNER_TEMP/release-authorization-inputs/protected-final-release-observation.txt"
          evidence_commit_epoch="$(git -C "$RELEASE_SOURCE_WORKSPACE" show -s --format=%ct "$EVIDENCE_COMMIT")"
          evidence_commit_committed_at="$(node -e \
            'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' \
            "$evidence_commit_epoch")"
          DEPLOYMENT_CONFIG_PATH="$RUNNER_TEMP/release-authorization-inputs/deployment-config.json" \
          DEPLOYMENT_STATE_PATH="$RUNNER_TEMP/release-authorization-inputs/deployment-state.json" \
          RELEASE_ASSET_CANDIDATE_PATH="$RUNNER_TEMP/release-authorization-inputs/reviewed-asset-candidate.json" \
          RELEASE_EVIDENCE_COMMIT="$EVIDENCE_COMMIT" \
          RELEASE_EVIDENCE_COMMITTED_AT="$evidence_commit_committed_at" \
          RELEASE_MANIFEST_PATH="$RUNNER_TEMP/release-authorization-inputs/deployment-manifest.json" \
          RELEASE_MANIFEST_REPOSITORY_PATH="$manifest_repository_path" \
          RELEASE_PERMISSIONED_POOL_FORK_REHEARSAL_PATH="$RUNNER_TEMP/release-authorization-inputs/permissioned-pool-robinhood-fork-rehearsal.json" \
          RELEASE_PERMISSIONED_POOL_GRAPH_PATH="$RUNNER_TEMP/release-authorization-inputs/permissioned-pool-graph.json" \
          RELEASE_PERMISSIONED_POOL_OFFICIAL_SOURCE_BUILD_PATH="$RUNNER_TEMP/release-authorization-inputs/permissioned-pool-official-source-build.json" \
          RELEASE_REGISTRY_REVALIDATION_STAGE=protected-final \
          RELEASE_ROBINHOOD_REGISTRY_RESPONSE_PATH="$RUNNER_TEMP/release-authorization-inputs/robinhood-registry-response.json" \
          RELEASE_ROBINHOOD_REGISTRY_REVALIDATION_PATH="$RUNNER_TEMP/release-authorization-inputs/robinhood-registry-revalidation.json" \
          RELEASE_SOURCE_COMMIT="$SOURCE_COMMIT" \
          RELEASE_TAG_OBJECT="$RELEASE_TAG_OBJECT" \
          SUBMIT_EXPLORER_VERIFICATION=false \
            pnpm --dir "$RELEASE_SOURCE_WORKSPACE" contracts:verify:mainnet 2>&1 \
              | node "$GITHUB_WORKSPACE/scripts/release/redact-stream.mjs" ROBINHOOD_MAINNET_RPC_URL \
              | tee "$RUNNER_TEMP/release-authorization-inputs/protected-final-manifest-verification.txt"
          pnpm --dir "$RELEASE_SOURCE_WORKSPACE" --filter @gumball-6900/config fork:evidence:export -- \
            --github-env "$RUNNER_TEMP/release-authorization-inputs/protected-final-testnet-fork.env" \
            --context "$RUNNER_TEMP/release-authorization-inputs/protected-final-testnet-fork-evidence.json"
          pnpm --dir "$RELEASE_SOURCE_WORKSPACE" --filter @gumball-6900/config fork:evidence:live:verify 2>&1 \
            | node "$GITHUB_WORKSPACE/scripts/release/redact-stream.mjs" ROBINHOOD_TESTNET_RPC_URL \
            | tee "$RUNNER_TEMP/release-authorization-inputs/protected-final-testnet-observation.txt"
          git -C "$RELEASE_SOURCE_WORKSPACE" diff --exit-code
          git -C "$RELEASE_SOURCE_WORKSPACE" diff --cached --exit-code
          node "$GITHUB_WORKSPACE/scripts/release/assert-tracked-worktree.mjs" \
            --workspace "$RELEASE_SOURCE_WORKSPACE" --commit "$SOURCE_COMMIT"
          node --input-type=module - \
            "$RUNNER_TEMP/release-authorization-inputs/protected-authorization-context.json" <<'NODE'
          import { writeFileSync } from 'node:fs';

          const output = process.argv[2];
          const env = process.env;
          const oid = /^[0-9a-f]{40}$/;
          const positiveInteger = /^[1-9][0-9]*$/;
          if (!oid.test(env.SOURCE_COMMIT ?? '') || env.SOURCE_COMMIT !== env.GITHUB_WORKFLOW_SHA) {
            throw new Error('Protected authorization source/workflow binding is invalid');
          }
          for (const [name, value] of [
            ['EVIDENCE_COMMIT', env.EVIDENCE_COMMIT],
            ['RELEASE_TAG_OBJECT', env.RELEASE_TAG_OBJECT],
          ]) {
            if (!oid.test(value ?? '')) throw new Error(`${name} is invalid`);
          }
          if (!positiveInteger.test(env.GITHUB_RUN_ID ?? '')) throw new Error('GITHUB_RUN_ID is invalid');
          if (!positiveInteger.test(env.GITHUB_RUN_ATTEMPT ?? '')) throw new Error('GITHUB_RUN_ATTEMPT is invalid');
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(env.GITHUB_REPOSITORY ?? '')) {
            throw new Error('GITHUB_REPOSITORY is invalid');
          }
          const expectedWorkflowRef = `${env.GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main`;
          if (env.GITHUB_WORKFLOW_REF !== expectedWorkflowRef) throw new Error('GITHUB_WORKFLOW_REF is invalid');
          const context = {
            environment: 'release-approval',
            evidenceCommit: env.EVIDENCE_COMMIT,
            kind: 'gumball-6900-protected-authorization-context',
            releaseTag: env.RELEASE_TAG,
            repository: env.GITHUB_REPOSITORY,
            runAttempt: env.GITHUB_RUN_ATTEMPT,
            runId: env.GITHUB_RUN_ID,
            schemaVersion: 1,
            sourceCommit: env.SOURCE_COMMIT,
            tagObject: env.RELEASE_TAG_OBJECT,
            workflowRef: env.GITHUB_WORKFLOW_REF,
            workflowSha: env.GITHUB_WORKFLOW_SHA,
          };
          writeFileSync(output, `${JSON.stringify(context, null, 2)}\n`, { encoding: 'utf8', flag: 'wx', mode: 0o600 });
          NODE
          echo 'Release-candidate evidence is technically authorized.'
          echo 'No package, subgraph, web artifact, verification request, role transfer, funding, or mainnet transaction was published or sent.'
          echo 'Those actions remain separate protected external stages requiring explicit authorization and configured destinations.'
      - name: Checksum protected authorization evidence
        if: always()
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/release-authorization-inputs"
          mkdir -p "$output"
          cd "$output"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: protected-release-authorization-inputs-${{ inputs.releaseTag }}
          path: ${{ runner.temp }}/release-authorization-inputs/
          retention-days: 365
