specVersion: 1.3.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: GBX
    network: robinhood
    source:
      abi: GBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: GBX
          file: ./abis/GBX.json
      eventHandlers:
        - event: Minted(indexed address,uint256)
          handler: handleMinted
        - event: Burned(indexed address,uint256)
          handler: handleBurned
        - event: MinterSet(indexed address,indexed address)
          handler: handleMinterSet
      file: ./src/gbx.ts
  - kind: ethereum/contract
    name: Mine
    network: robinhood
    source:
      abi: Mine
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - MiningSlot
        - ProtocolEvent
      abis:
        - name: Mine
          file: ./abis/Mine.json
      eventHandlers:
        - event: MinerPaymentClaimed(indexed address,uint256)
          handler: handleMinerPaymentClaimed
        - event: EmissionSettled(indexed address,indexed uint256,indexed uint256,uint256)
          handler: handleEmissionSettled
        - event: Mined(indexed address,indexed address,indexed
            uint256,uint256,address,uint256,uint256,uint256,string)
          handler: handleMined
        - event: MinerPaymentAccrued(indexed address,indexed uint256,indexed
            uint256,uint256)
          handler: handleMinerPaymentAccrued
        - event: RevenueDeposited(indexed uint256,indexed uint256,uint256)
          handler: handleMiningRevenueDeposited
      file: ./src/mine.ts
  - kind: ethereum/contract
    name: SignalGBX
    network: robinhood
    source:
      abi: SignalGBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: SignalGBX
          file: ./abis/SignalGBX.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
        - event: Signaled(indexed address,indexed address,uint256)
          handler: handleSignaled
        - event: SignalWithdrawn(indexed address,indexed address,uint256)
          handler: handleSignalWithdrawn
        - event: ResonanceSet(indexed address)
          handler: handleSignalResonanceSet
      file: ./src/signal-gbx.ts
  - kind: ethereum/contract
    name: ResonanceRouter
    network: robinhood
    source:
      abi: ResonanceRouter
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: ResonanceRouter
          file: ./abis/ResonanceRouter.json
      eventHandlers:
        - event: RevenueRouted(indexed address,uint256)
          handler: handleRevenueRouted
      file: ./src/resonance-router.ts
  - kind: ethereum/contract
    name: Resonance
    network: robinhood
    source:
      abi: Resonance
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - Strategy
        - SignalPosition
        - ProtocolEvent
      abis:
        - name: Resonance
          file: ./abis/Resonance.json
      eventHandlers:
        - event: BribeBpsSet(uint256,uint256)
          handler: handleBribeBpsSet
        - event: BribeRewardTokenAdded(indexed address,indexed address,indexed address)
          handler: handleBribeRewardTokenAdded
        - event: RevenueDistributed(indexed address,indexed address,uint256)
          handler: handleRevenueDistributed
        - event: RevenueNotified(indexed address,uint256)
          handler: handleRevenueNotified
        - event: StrategyAdded(indexed address,indexed address,indexed address,address)
          handler: handleStrategyAdded
        - event: StrategyKilled(indexed address)
          handler: handleStrategyKilled
        - event: SignalAdded(indexed address,indexed address,uint256)
          handler: handleSignalAdded
        - event: SignalRemoved(indexed address,indexed address,uint256)
          handler: handleSignalRemoved
        - event: ResonanceRouterSet(indexed address)
          handler: handleResonanceRouterSet
      file: ./src/resonance.ts
  - kind: ethereum/contract
    name: Fund
    network: robinhood
    source:
      abi: Fund
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: Fund
          file: ./abis/Fund.json
      eventHandlers:
        - event: GBXBurned(indexed address,uint256)
          handler: handleFundGBXBurned
        - event: Redeemed(indexed address,indexed address,uint256,uint256)
          handler: handleRedeemed
      file: ./src/fund.ts
templates:
  - kind: ethereum/contract
    name: BribeTemplate
    network: robinhood
    source:
      abi: Bribe
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - ProtocolEvent
      abis:
        - name: Bribe
          file: ./abis/Bribe.json
      eventHandlers:
        - event: RewardNotified(indexed address,uint256)
          handler: handleRewardNotified
        - event: RewardPaid(indexed address,indexed address,uint256)
          handler: handleRewardPaid
      file: ./src/bribe.ts
  - kind: ethereum/contract
    name: BribeRouterTemplate
    network: robinhood
    source:
      abi: BribeRouter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - ProtocolEvent
      abis:
        - name: BribeRouter
          file: ./abis/BribeRouter.json
      eventHandlers:
        - event: RewardRouted(indexed address,indexed address,uint256)
          handler: handleRouterRewardRouted
      file: ./src/bribe-router.ts
