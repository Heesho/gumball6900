enum PendingSignalAction {
  PENDING
  ACTIVATED
  RESET
  CANCELLED
}

enum StrategyKind {
  ACQUISITION
  BUYBACK
  HOLD_USDG
  UNKNOWN
}

enum LiquidityEventKind {
  POOL_SEEDED
  POSITION_MINTED
  FEES_COLLECTED
  RANGE_SWEPT
  MIGRATION_STARTED
  MIGRATION_POSITION_REMOVED
  MIGRATION_POSITION_ADDED
  MIGRATION_COMPLETED
  MIGRATION_PAUSE_SET
}

enum RevenueNotificationKind {
  ALLOCATION_ACCOUNTING
  ROUTER_TRANSFER
}

type Protocol @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  gbxToken: GBXToken
  genesisBootstrap: GenesisBootstrap
  miningPool: Bytes
  usdgAsset: VaultAsset
  cumulativeMintedRaw: BigInt!
  cumulativeBurnedRaw: BigInt!
  totalSupplyRaw: BigInt!
  genesisContributedRaw: BigInt!
  miningContributedRaw: BigInt!
  revenueNotifiedUSDGRaw: BigInt!
  strategySpentUSDGRaw: BigInt!
  redeemedSharesRaw: BigInt!
  buybackSpentUSDGRaw: BigInt!
  buybackBurnedGBXRaw: BigInt!
  liquidityGBXFeesBurnedRaw: BigInt!
  liquidityUSDGFeesToVaultRaw: BigInt!
  stakedGBXRaw: BigInt!
  assetCount: Int!
  strategyCount: Int!
  redemptionCount: Int!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

