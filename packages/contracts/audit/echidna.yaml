projectName: GUM BALL 6900 protocol state-machine campaign
testMode: property
testLimit: 100000
seqLen: 150
timeout: 3600
seed: 6900
shrinkLimit: 5000
# One random step can cross a complete 69-day Mine halving period; a sequence can reach the permanent tail.
maxTimeDelay: 5961600
maxBlockDelay: 50400
coverage: true
# The constructor-only campaign graph produces a test harness runtime of roughly 31 KB.
# This limit applies only to the harness; production contract sizes remain enforced separately.
codeSize: 4294967295
testMaxGas: 125000000
propMaxGas: 125000000
corpusDir: audit/reports/echidna-corpus
coverageDir: audit/reports/echidna-coverage
format: json
stopOnFail: true
# No target contains SELFDESTRUCT; enabling destruction mode leaves Echidna 2.3.2
# with an empty destruction-call set and crashes its workers before the first call.
testDestruction: false
allContracts: false
disableOnchainSources: true
cryticArgs:
  - --compile-force-framework
  - foundry
