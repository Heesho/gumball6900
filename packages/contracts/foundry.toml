[profile.default]
src = "src"
test = "test/minimal"
script = "script/minimal"
out = "out"
libs = ["../../node_modules", "node_modules", "lib"]
cache_path = "cache/forge"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
fuzz = { runs = 10_000, max_test_rejects = 1_000_000 }
invariant = { runs = 1_000, depth = 500, fail_on_revert = true }
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read", path = "../simulations/fixtures" },
]

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 500, fail_on_revert = true }

[profile.nightly]
fuzz = { runs = 100_000 }
invariant = { runs = 10_000, depth = 1_000, fail_on_revert = true }

# Echidna identifies constructor-deployed contracts by compiler metadata when resolving
# immutable references. Keep metadata enabled only for this test-only build profile;
# production and release artifact profiles continue to use metadata-free bytecode.
[profile.echidna]
bytecode_hash = "ipfs"
cbor_metadata = true

# The Echidna/Medusa campaign harness deploys the whole protocol graph from its own constructor, as property-mode
# fuzzing requires, so its initcode exceeds EIP-3860 and cannot live in the default size-gated build profile.
# Medusa sets `codeSizeCheckDisabled` for the same test-only reason.
#
# Run with `pnpm --filter @gumball-6900/contracts test:integration`.
[profile.integration]
test = "test/integration"
fuzz = { runs = 256 }

# Opt-in, non-broadcast validation of the atomic launcher against a caller-supplied pinned Robinhood Chain fork.
# Run with `FOUNDRY_PROFILE=launcher_fork forge test --fork-url <reviewed-rpc> --fork-block-number <pin>`.
[profile.launcher_fork]
test = "test/fork"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
