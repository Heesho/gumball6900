specVersion: 1.3.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: GBX
    network: robinhood
    source:
      abi: GBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: GBX
          file: ./abis/GBX.json
      eventHandlers:
        - event: Minted(indexed address,uint256)
          handler: handleMinted
        - event: Burned(indexed address,uint256)
          handler: handleBurned
        - event: MinterSet(indexed address,indexed address)
          handler: handleMinterSet
      file: ./src/gbx.ts
  - kind: ethereum/contract
    name: Fundraiser
    network: robinhood
    source:
      abi: Fundraiser
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - FundraiserEpoch
        - ProtocolEvent
      abis:
        - name: Fundraiser
          file: ./abis/Fundraiser.json
      eventHandlers:
        - event: Contributed(indexed address,indexed address,indexed uint256,uint256)
          handler: handleContributed
        - event: Claimed(indexed address,indexed uint256,uint256)
          handler: handleClaimed
        - event: EpochSettled(indexed uint256,uint256,uint256,uint256)
          handler: handleEpochSettled
      file: ./src/fundraiser.ts
  - kind: ethereum/contract
    name: LiquidityPosition
    network: robinhood
    source:
      abi: LiquidityPosition
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: LiquidityPosition
          file: ./abis/LiquidityPosition.json
      eventHandlers:
        - event: FeesProcessed(indexed uint256,indexed address,uint256,uint256)
          handler: handleFeesProcessed
        - event: PositionMigrated(indexed uint256,indexed address,indexed address)
          handler: handlePositionMigrated
        - event: PositionRecorded(indexed uint256,indexed address,indexed bytes32)
          handler: handlePositionRecorded
        - event: SuccessorSet(indexed address)
          handler: handleLiquiditySuccessorSet
      file: ./src/liquidity-position.ts
  - kind: ethereum/contract
    name: SignalGBX
    network: robinhood
    source:
      abi: SignalGBX
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: SignalGBX
          file: ./abis/SignalGBX.json
      eventHandlers:
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,uint256)
          handler: handleUnstaked
        - event: VoterSet(indexed address)
          handler: handleSignalVoterSet
      file: ./src/signal-gbx.ts
  - kind: ethereum/contract
    name: VoterRouter
    network: robinhood
    source:
      abi: VoterRouter
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: VoterRouter
          file: ./abis/VoterRouter.json
      eventHandlers:
        - event: RevenueRouted(indexed address,uint256)
          handler: handleRevenueRouted
      file: ./src/voter-router.ts
  - kind: ethereum/contract
    name: Voter
    network: robinhood
    source:
      abi: Voter
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - Strategy
        - ProtocolEvent
      abis:
        - name: Voter
          file: ./abis/Voter.json
      eventHandlers:
        - event: BribeBpsSet(uint256,uint256)
          handler: handleBribeBpsSet
        - event: BribeRewardAdded(indexed address,indexed address,indexed address)
          handler: handleBribeRewardAdded
        - event: RevenueDistributed(indexed address,indexed address,uint256)
          handler: handleRevenueDistributed
        - event: RevenueNotified(indexed address,uint256)
          handler: handleRevenueNotified
        - event: StrategyAdded(indexed address,indexed address,indexed
            address,address,uint8)
          handler: handleStrategyAdded
        - event: StrategyKilled(indexed address)
          handler: handleStrategyKilled
        - event: VoteCast(indexed address,indexed address,uint256)
          handler: handleVoteCast
        - event: VoteReset(indexed address,indexed address,uint256)
          handler: handleVoteReset
        - event: VoterRouterSet(indexed address)
          handler: handleVoterRouterSet
      file: ./src/voter.ts
  - kind: ethereum/contract
    name: Fund
    network: robinhood
    source:
      abi: Fund
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - Account
        - ProtocolEvent
      abis:
        - name: Fund
          file: ./abis/Fund.json
      eventHandlers:
        - event: GBXBurned(indexed address,uint256)
          handler: handleFundGBXBurned
        - event: Redeemed(indexed address,indexed address,uint256,uint256)
          handler: handleRedeemed
        - event: SuccessorSet(indexed address)
          handler: handleSuccessorSet
        - event: TokenMigrated(indexed address,indexed address,indexed address,uint256)
          handler: handleTokenMigrated
      file: ./src/fund.ts
  - kind: ethereum/contract
    name: TimelockController
    network: robinhood
    source:
      abi: TimelockController
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolState
        - ProtocolEvent
      abis:
        - name: TimelockController
          file: ./abis/TimelockController.json
      eventHandlers:
        - event: CallScheduled(indexed bytes32,indexed
            uint256,address,uint256,bytes,bytes32,uint256)
          handler: handleCallScheduled
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: handleCallExecuted
        - event: CallSalt(indexed bytes32,bytes32)
          handler: handleCallSalt
        - event: Cancelled(indexed bytes32)
          handler: handleCancelled
        - event: MinDelayChange(uint256,uint256)
          handler: handleMinDelayChange
      file: ./src/timelock-controller.ts
