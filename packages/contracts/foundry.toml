[profile.default]
src = "src"
test = "test/minimal"
script = "script/minimal"
out = "out"
libs = ["../../node_modules", "node_modules", "lib"]
cache_path = "cache/forge"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
fuzz = { runs = 10_000, max_test_rejects = 1_000_000 }
invariant = { runs = 1_000, depth = 500, fail_on_revert = true }
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read", path = "../simulations/fixtures" },
]

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 500, fail_on_revert = true }

[profile.nightly]
fuzz = { runs = 100_000 }
invariant = { runs = 10_000, depth = 1_000, fail_on_revert = true }

# Suites that cannot live in the default profile because they pull oversized contracts into the build graph, which
# would make `forge build --sizes` reject a contract that gate exists to protect. Neither is deployed on chain:
#
#   - the Echidna/Medusa campaign harness deploys the whole protocol graph from its own constructor, as property-mode
#     fuzzing requires, so its initcode exceeds EIP-3860 (Medusa sets `codeSizeCheckDisabled` for the same reason); and
#   - the liquidity-fee integration suite deploys real Uniswap v4, whose `PositionManager` exceeds EIP-170 when
#     built at this project's `optimizer_runs` rather than the settings Uniswap ships it with.
#
# Run with `pnpm --filter @gumball-6900/contracts test:integration`.
[profile.integration]
test = "test/integration"
fuzz = { runs = 256 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
