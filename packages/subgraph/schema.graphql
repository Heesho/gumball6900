type ProtocolState @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  resonance: Bytes
  resonanceRouter: Bytes
  bribeBps: BigInt!
  lifetimeMintedRaw: BigInt!
  lifetimeBurnedRaw: BigInt!
  totalSupplyRaw: BigInt!
  minedGBXRaw: BigInt!
  miningPaymentsRaw: BigInt!
  previousMinerPaymentsRaw: BigInt!
  miningRevenueDepositedRaw: BigInt!
  miningSlotCount: BigInt!
  routedRevenueRaw: BigInt!
  notifiedRevenueRaw: BigInt!
  revenueNotificationCount: BigInt!
  latestRevenueNotificationRaw: BigInt!
  latestRevenueNotificationAt: BigInt!
  distributedRevenueRaw: BigInt!
  signaledGBXRaw: BigInt!
  fundBurnedGBXRaw: BigInt!
  redeemedGBXRaw: BigInt!
  strategyCount: Int!
  liveStrategyCount: Int!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Account @entity(immutable: false) {
  id: ID!
  address: Bytes!
  gbxMinedRaw: BigInt!
  gbxBurnedRaw: BigInt!
  miningPaymentAccruedRaw: BigInt!
  miningUSDGClaimedRaw: BigInt!
  signaledGBXRaw: BigInt!
  signalWeightRaw: BigInt!
  currentDelegate: Bytes!
  delegatedVotesRaw: BigInt!
  redeemedGBXRaw: BigInt!
  signalPositions: [SignalPosition!]! @derivedFrom(field: "account")
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type MiningSlot @entity(immutable: false) {
  id: ID!
  mineContract: Bytes!
  index: BigInt!
  epoch: BigInt!
  currentMiner: Bytes!
  currentMessage: String!
  initialPriceRaw: BigInt!
  auctionStartedAt: BigInt!
  tpsRaw: BigInt!
  totalMinedRaw: BigInt!
  totalReplacementPaidRaw: BigInt!
  lastPriceRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Strategy @entity(immutable: false) {
  id: ID!
  address: Bytes!
  bribe: Bytes!
  bribeRouter: Bytes!
  paymentToken: Bytes!
  live: Boolean!
  totalSignalWeightRaw: BigInt!
  distributedRevenueRaw: BigInt!
  notifiedRewardRaw: BigInt!
  paidRewardRaw: BigInt!
  routerRewardsRoutedRaw: BigInt!
  signalPositions: [SignalPosition!]! @derivedFrom(field: "strategy")
  createdBlockNumber: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

"""
Current event-observed signal owned by one account in one Strategy.

This discovery index is removed when its amount reaches zero. It is not authoritative for transaction construction;
clients must refresh the paired Bribe balance onchain before submitting a write.
"""
type SignalPosition @entity(immutable: false) {
  id: ID!
  account: Account!
  strategy: Strategy!
  accountAddress: Bytes!
  strategyAddress: Bytes!
  amountRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

"""
Immutable positional record for each protocol or governance event handled by this subgraph.
"""
type ProtocolEvent @entity(immutable: true) {
  id: ID!
  eventType: String!
  contractAddress: Bytes!
  addresses: [Bytes!]!
  values: [BigInt!]!
  bytesValues: [Bytes!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
