rules:
  - id: gumball-no-tx-origin
    languages: [solidity]
    severity: ERROR
    message: Authentication must never depend on tx.origin.
    pattern: tx.origin

  - id: gumball-no-delegatecall
    languages: [solidity]
    severity: ERROR
    message: The non-upgradeable protocol forbids delegatecall.
    pattern: $TARGET.delegatecall(...)

  - id: gumball-no-selfdestruct
    languages: [solidity]
    severity: ERROR
    message: Protocol contracts must not self-destruct.
    pattern-either:
      - pattern: selfdestruct(...)
      - pattern: suicide(...)

  - id: gumball-no-inline-assembly
    languages: [solidity]
    severity: ERROR
    message: Inline assembly requires a separately reviewed, documented exception.
    pattern-regex: '\bassembly\s*\{'

  - id: gumball-no-unchecked-block
    languages: [solidity]
    severity: ERROR
    message: Unchecked arithmetic requires a separately reviewed proof and test.
    pattern: unchecked { ... }

  - id: gumball-no-generic-low-level-call
    languages: [solidity]
    severity: ERROR
    message: Generic low-level calls are forbidden outside the purpose-limited ProtocolTimelock.
    paths:
      exclude:
        - '**/src/access/ProtocolTimelock.sol'
    pattern: $TARGET.call(...)
