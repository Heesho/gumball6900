name: Nightly security and economics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 10.14.0
  PYTHON_VERSION: 3.11.9

jobs:
  deep-campaigns:
    name: Deep fuzz, invariants, and differential models
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          cache: pip
          cache-dependency-path: packages/simulations/requirements-dev.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Python simulation test tools
        run: |
          python -m pip install --requirement packages/simulations/requirements-dev.lock
          python -m pip check
      - name: Offline registry and bytecode fixture campaigns
        run: pnpm config:test
      - name: Nightly Foundry profile
        env:
          FOUNDRY_PROFILE: nightly
        working-directory: packages/contracts
        run: forge test
      - name: Long-horizon economic differential tests
        run: |
          pnpm simulations:test
          pnpm simulations:fixtures:check
          pnpm simulations:charts:check
      - name: Archive nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: nightly-evidence-${{ github.run_id }}
          path: |
            packages/contracts/audit/reports/
            packages/simulations/fixtures/
            packages/simulations/charts/
          retention-days: 90

  robinhood-mainnet-recon:
    name: Pinned Robinhood mainnet reconnaissance fork
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: Select one confirmation-lagged provisional observation block
        id: pin
        env:
          ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        run: |
          test -n "$ROBINHOOD_MAINNET_ARCHIVE_RPC_URL"
          mkdir -p packages/contracts/audit/reports/nightly-mainnet
          pnpm config:nightly:mainnet:pin -- \
            --rpc-url "$ROBINHOOD_MAINNET_ARCHIVE_RPC_URL" \
            --confirmation-depth 64 \
            --output packages/contracts/audit/reports/nightly-mainnet/pin.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pin = JSON.parse(readFileSync('packages/contracts/audit/reports/nightly-mainnet/pin.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `block_number=${pin.blockNumber}\nobserved_at=${pin.observedAt}\n`);
          NODE
      - name: Reconstruct stock-token identity and complete control history at the pin
        env:
          ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        run: |
          pnpm config:manifest:assets -- \
            --rpc-url "$ROBINHOOD_MAINNET_ARCHIVE_RPC_URL" \
            --block-number "${{ steps.pin.outputs.block_number }}" \
            --observed-at "${{ steps.pin.outputs.observed_at }}" \
            --output packages/contracts/audit/reports/nightly-mainnet/assets.json
      - name: Re-derive canonical wrapped-BTC bridge and authority topology at the pin
        env:
          ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        run: |
          pnpm config:manifest:wrapped-btc -- \
            --rpc-url "$ROBINHOOD_MAINNET_ARCHIVE_RPC_URL" \
            --block-number "${{ steps.pin.outputs.block_number }}" \
            --output packages/contracts/audit/reports/nightly-mainnet/wrapped-btc.json
      - name: Fail on canonical token or Uniswap v4 runtime drift at the pin
        env:
          ROBINHOOD_MAINNET_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        run: |
          pnpm config:manifest:bytecode -- \
            --rpc-url "$ROBINHOOD_MAINNET_ARCHIVE_RPC_URL" \
            --block-number "${{ steps.pin.outputs.block_number }}" \
            --observed-at "${{ steps.pin.outputs.observed_at }}" \
            --expected-hashes packages/config/deployments/provisional-mainnet-bytecode-hashes.2026-08-01.json \
            --output packages/contracts/audit/reports/nightly-mainnet/bytecode.json
      - name: Execute the exact-block read-only reconnaissance fork
        env:
          ROBINHOOD_MAINNET_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_ARCHIVE_RPC_URL }}
        working-directory: packages/contracts
        run: |
          set -o pipefail
          forge test --match-path 'test/foundry/fork-nightly/*' -vv 2>&1 \
            | node "$GITHUB_WORKSPACE/scripts/release/redact-stream.mjs" ROBINHOOD_MAINNET_RPC_URL
      - name: Archive provisional nightly mainnet evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: nightly-mainnet-recon-${{ github.run_id }}
          path: packages/contracts/audit/reports/nightly-mainnet/
          retention-days: 90

  external-tooling:
    name: Echidna, Medusa, Mythril, Slither, Aderyn, Semgrep, and Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve analyzer Python from the committed environment policy
        id: analyzer_environment
        run: |
          node packages/contracts/audit/resolve-analyzer-environment.mjs \
            --workspace "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          architecture: x64
          python-version: ${{ steps.analyzer_environment.outputs.python_version }}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.24.6'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: Install repository-pinned nightly analyzers
        run: packages/contracts/audit/install-tools.sh nightly
      - name: Run repository-pinned external campaigns
        run: packages/contracts/audit/run-nightly.sh
      - name: Archive external-tool evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: external-security-${{ github.run_id }}
          path: packages/contracts/audit/reports/
          retention-days: 90

  dependency-report:
    name: Dependency drift and advisory report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Capture available updates without mutating the lockfile
        run: |
          mkdir -p dependency-report
          set +e
          pnpm outdated --recursive --format json > dependency-report/outdated.json
          outdated_exit=$?
          set -e
          if [ "$outdated_exit" -gt 1 ]; then
            exit "$outdated_exit"
          fi
          pnpm audit --json > dependency-report/audit.json || true
          node packages/contracts/audit/check-pnpm-audit.mjs dependency-report/audit.json
          git diff --exit-code -- pnpm-lock.yaml ':(glob)**/package.json'
      - name: Archive dependency drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: dependency-report-${{ github.run_id }}
          path: dependency-report/
          retention-days: 90
