type ProtocolState @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  resonance: Bytes
  resonanceRouter: Bytes
  protocolGovernor: Bytes
  initialSupplyRaw: BigInt!
  lifetimeMintedRaw: BigInt!
  lifetimeBurnedRaw: BigInt!
  totalSupplyRaw: BigInt!
  minedGBXRaw: BigInt!
  miningPaymentsRaw: BigInt!
  previousMinerPaymentsRaw: BigInt!
  miningRevenueRoutedRaw: BigInt!
  miningCapacity: BigInt!
  liquidityPrincipalRaw: BigInt!
  liquidityFeeHarvestCount: BigInt!
  liquidityUSDGRoutedRaw: BigInt!
  liquidityGBXBurnedRaw: BigInt!
  routedRevenueRaw: BigInt!
  notifiedRevenueRaw: BigInt!
  revenueNotificationCount: BigInt!
  latestRevenueNotificationRaw: BigInt!
  latestRevenueNotificationAt: BigInt!
  distributedRevenueRaw: BigInt!
  stakedGBXRaw: BigInt!
  fundBurnedGBXRaw: BigInt!
  redeemedGBXRaw: BigInt!
  timelockDelay: BigInt!
  strategyCount: Int!
  governanceProposalCount: BigInt!
  governanceVoteCount: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Account @entity(immutable: false) {
  id: ID!
  address: Bytes!
  gbxInitialAllocationRaw: BigInt!
  gbxMinedRaw: BigInt!
  gbxBurnedRaw: BigInt!
  miningPaymentAccruedRaw: BigInt!
  miningUSDGClaimedRaw: BigInt!
  stakedGBXRaw: BigInt!
  signalWeightRaw: BigInt!
  currentDelegate: Bytes!
  delegatedVotesRaw: BigInt!
  governanceVotesCast: BigInt!
  redeemedGBXRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type MiningSlot @entity(immutable: false) {
  id: ID!
  mineContract: Bytes!
  index: BigInt!
  epoch: BigInt!
  currentMiner: Bytes!
  initialPriceRaw: BigInt!
  auctionStartedAt: BigInt!
  upsRaw: BigInt!
  totalMinedRaw: BigInt!
  totalReplacementPaidRaw: BigInt!
  lastPriceRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Strategy @entity(immutable: false) {
  id: ID!
  address: Bytes!
  bribe: Bytes!
  bribeRouter: Bytes!
  paymentToken: Bytes!
  live: Boolean!
  totalSignalWeightRaw: BigInt!
  distributedRevenueRaw: BigInt!
  notifiedRewardRaw: BigInt!
  paidRewardRaw: BigInt!
  routerFundPaymentAccruedRaw: BigInt!
  routerFundPaymentPaidRaw: BigInt!
  pendingRouterFundPaymentRaw: BigInt!
  bribeFundRewardAccruedRaw: BigInt!
  bribeFundRewardPaidRaw: BigInt!
  pendingBribeFundRewardRaw: BigInt!
  createdBlockNumber: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

"""
Event-derived Governor proposal facts. `lastLifecycleEvent` changes only when a Governor lifecycle event is observed;
it is not a live reconstruction of the Governor state machine between events.
"""
type GovernanceProposal @entity(immutable: false) {
  id: ID!
  governor: Bytes!
  proposalId: BigInt!
  proposer: Bytes
  targets: [Bytes!]
  values: [BigInt!]
  signatures: [String!]
  calldatas: [Bytes!]
  voteStart: BigInt
  voteEnd: BigInt
  description: String
  etaSeconds: BigInt
  lastLifecycleEvent: String!
  againstVotesRaw: BigInt!
  forVotesRaw: BigInt!
  abstainVotesRaw: BigInt!
  voteCount: BigInt!
  createdBlockNumber: BigInt
  createdTimestamp: BigInt
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
  votes: [GovernanceVote!]! @derivedFrom(field: "proposal")
}

"""
Immutable vote receipt copied from one Governor VoteCast or VoteCastWithParams log.
"""
type GovernanceVote @entity(immutable: true) {
  id: ID!
  proposal: GovernanceProposal!
  governor: Bytes!
  proposalId: BigInt!
  voter: Bytes!
  support: Int!
  weightRaw: BigInt!
  reason: String!
  params: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
Latest event-derived membership for one Timelock role/account pair. Complete role closure requires indexing from the
Timelock deployment block so constructor grants are present.
"""
type TimelockRoleMembership @entity(immutable: false) {
  id: ID!
  timelock: Bytes!
  role: Bytes!
  account: Bytes!
  granted: Boolean!
  lastSender: Bytes!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
  lastTransactionHash: Bytes!
  lastLogIndex: BigInt!
}

"""
Immutable positional record for each protocol or governance event handled by this subgraph.
"""
type ProtocolEvent @entity(immutable: true) {
  id: ID!
  eventType: String!
  contractAddress: Bytes!
  addresses: [Bytes!]!
  values: [BigInt!]!
  bytesValues: [Bytes!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
