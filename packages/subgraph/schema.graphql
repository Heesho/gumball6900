type ProtocolState @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  gbxToken: Bytes
  emissionController: Bytes
  miningPool: Bytes
  cumulativeMintedRaw: BigInt!
  cumulativeBurnedRaw: BigInt!
  totalSupplyRaw: BigInt!
  miningContributedUSDGRaw: BigInt!
  miningEmittedGBXRaw: BigInt!
  vaultRevenueUSDGRaw: BigInt!
  redeemedGBXRaw: BigInt!
  strategySpentUSDGRaw: BigInt!
  buybackBurnedGBXRaw: BigInt!
  liquidityFeesBurnedGBXRaw: BigInt!
  liquidityFeesToVaultUSDGRaw: BigInt!
  stakedGBXRaw: BigInt!
  assetCount: Int!
  strategyCount: Int!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Account @entity(immutable: false) {
  id: ID!
  address: Bytes!
  gbxMintedRaw: BigInt!
  gbxBurnedRaw: BigInt!
  miningContributedUSDGRaw: BigInt!
  miningClaimedGBXRaw: BigInt!
  stakedGBXRaw: BigInt!
  signalWeightRaw: BigInt!
  redeemedGBXRaw: BigInt!
  buybackSoldGBXRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type MiningEpoch @entity(immutable: false) {
  id: ID!
  pool: Bytes!
  epochId: BigInt!
  startTime: BigInt
  endTime: BigInt
  totalContributedUSDGRaw: BigInt!
  teamFeeUSDGRaw: BigInt!
  vaultRevenueUSDGRaw: BigInt!
  emissionGBXRaw: BigInt!
  scheduledEmissionGBXRaw: BigInt
  nextScheduledEmissionGBXRaw: BigInt
  nonEmpty: Boolean
  settled: Boolean!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type VaultAsset @entity(immutable: false) {
  id: ID!
  token: Bytes!
  strategy: Bytes
  rewards: Bytes
  assetIndex: BigInt!
  live: Boolean!
  registeredBlockNumber: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Strategy @entity(immutable: false) {
  id: ID!
  address: Bytes!
  kind: String!
  targetToken: Bytes
  rewards: Bytes
  strategyIndex: BigInt
  live: Boolean!
  fillsPaused: Boolean!
  totalWeightRaw: BigInt!
  budgetUSDGRaw: BigInt!
  totalUSDGSpentRaw: BigInt!
  totalQuotedPaymentRaw: BigInt!
  totalObservedPaymentRaw: BigInt!
  totalVaultReceivedRaw: BigInt!
  totalRewardsNotifiedRaw: BigInt!
  totalRewardsClaimedRaw: BigInt!
  fillCount: Int!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type LiquidityPosition @entity(immutable: false) {
  id: ID!
  custodian: Bytes!
  positionId: BigInt!
  poolKeyHash: Bytes!
  previousOwner: Bytes!
  inCustody: Boolean!
  transferredTo: Bytes
  gbxFeesBurnedRaw: BigInt!
  usdgFeesToVaultRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

"""
Immutable positional record for each protocol-specific event indexed by the
manifest after its data source exists. `addresses`, `values`, `bytesValues`,
and `flag` follow event ABI order; `eventType` supplies the semantic label.
"""
type ProtocolEvent @entity(immutable: true) {
  id: ID!
  eventType: String!
  contractAddress: Bytes!
  addresses: [Bytes!]!
  values: [BigInt!]!
  bytesValues: [Bytes!]!
  flag: Boolean
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
