type ProtocolState @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  minter: Bytes
  signalVoter: Bytes
  voterRouter: Bytes
  fundSuccessor: Bytes
  liquidityPositionSuccessor: Bytes
  lifetimeMintedRaw: BigInt!
  lifetimeBurnedRaw: BigInt!
  totalSupplyRaw: BigInt!
  fundraiserContributionsRaw: BigInt!
  fundraiserClaimsRaw: BigInt!
  liquidityGBXBurnedRaw: BigInt!
  liquidityUSDGRoutedRaw: BigInt!
  routedRevenueRaw: BigInt!
  notifiedRevenueRaw: BigInt!
  distributedRevenueRaw: BigInt!
  stakedGBXRaw: BigInt!
  fundBurnedGBXRaw: BigInt!
  redeemedGBXRaw: BigInt!
  bribeBps: BigInt!
  timelockDelay: BigInt!
  strategyCount: Int!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Account @entity(immutable: false) {
  id: ID!
  address: Bytes!
  gbxMintedRaw: BigInt!
  gbxBurnedRaw: BigInt!
  contributedUSDGRaw: BigInt!
  claimedGBXRaw: BigInt!
  stakedGBXRaw: BigInt!
  votingWeightRaw: BigInt!
  redeemedGBXRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type FundraiserEpoch @entity(immutable: false) {
  id: ID!
  fundraiser: Bytes!
  epoch: BigInt!
  totalContributionsRaw: BigInt!
  totalClaimedGBXRaw: BigInt!
  settled: Boolean!
  scheduledEmissionRaw: BigInt!
  contributorEmissionRaw: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

type Strategy @entity(immutable: false) {
  id: ID!
  address: Bytes!
  bribe: Bytes!
  bribeRouter: Bytes!
  paymentToken: Bytes!
  kind: Int!
  live: Boolean!
  totalWeightRaw: BigInt!
  distributedRevenueRaw: BigInt!
  createdBlockNumber: BigInt!
  lastBlockNumber: BigInt!
  lastTimestamp: BigInt!
}

"""
Immutable positional record for each core protocol event handled by this subgraph.
"""
type ProtocolEvent @entity(immutable: true) {
  id: ID!
  eventType: String!
  contractAddress: Bytes!
  addresses: [Bytes!]!
  values: [BigInt!]!
  bytesValues: [Bytes!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
